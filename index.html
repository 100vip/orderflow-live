<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTCUSDT · 订单流决策板</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e6edf3;
    --muted: #8b9bb4;
    --hist: #5b8def;
    --up: #3ecf8e;
    --down: #f07178;
    --flat: #9aa7bd;
    --wait: #d2a8ff;
    --grid: #1e2a3a;
    --accent: #f0b429;
    --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    padding: 14px 20px 10px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: baseline;
    border-bottom: 1px solid var(--grid);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
    letter-spacing: .04em;
  }
  .pill.long, .pill.up { background: rgba(62,207,142,.18); color: var(--up); }
  .pill.short, .pill.down { background: rgba(240,113,120,.18); color: var(--down); }
  .pill.wait, .pill.flat { background: rgba(155,167,189,.12); color: var(--flat); }
  main { padding: 12px 14px 28px; max-width: 1100px; margin: 0 auto; }

  .board {
    background: linear-gradient(180deg, #15202b 0%, var(--panel) 100%);
    border: 1px solid var(--grid); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .board.wait-state { border-color: #2a3545; }
  .board.long-state { border-color: rgba(62,207,142,.45); box-shadow: 0 0 0 1px rgba(62,207,142,.08); }
  .board.short-state { border-color: rgba(240,113,120,.45); box-shadow: 0 0 0 1px rgba(240,113,120,.08); }
  .board .kicker { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .board .headline {
    font-size: 34px; font-weight: 800; line-height: 1.15; margin: 0 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .board.long-state .headline { color: var(--up); }
  .board.short-state .headline { color: var(--down); }
  .board.wait-state .headline { color: var(--flat); }
  .board .detail { font-size: 14px; color: var(--text); line-height: 1.5; opacity: .92; }
  .board .risk {
    margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.5;
    padding: 8px 10px; border-radius: 8px; background: rgba(240,180,41,.06);
    border: 1px solid rgba(240,180,41,.18);
  }
  .price-row {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; margin-bottom: 12px;
  }
  .price { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px; margin-bottom: 14px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--grid); border-radius: 12px;
    padding: 14px 16px; position: relative;
  }
  .card.dim { opacity: .72; }
  .card.hot-long { border-color: rgba(62,207,142,.4); }
  .card.hot-short { border-color: rgba(240,113,120,.4); }
  .card h2 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  .badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  }
  .badge.go { background: rgba(62,207,142,.15); color: var(--up); }
  .badge.short { background: rgba(240,113,120,.15); color: var(--down); }
  .badge.wait { background: rgba(155,167,189,.12); color: var(--flat); }
  .badge.off { background: rgba(155,167,189,.08); color: #6b7a90; }
  .big {
    font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .big.long { color: var(--up); }
  .big.short { color: var(--down); }
  .big.wait { color: var(--flat); font-size: 26px; }
  .sub { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 6px; }
  .sub b { color: var(--text); font-weight: 600; }
  .chart-wrap { width: 100%; height: 200px; }
  canvas { width: 100%; height: 100%; display: block; }
  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin-top: 10px;
  }
  .metric {
    background: #0e141c; border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px;
  }
  .metric .k { font-size: 11px; color: var(--muted); }
  .metric .v { font-size: 15px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .note {
    margin-top: 12px; padding: 12px 14px; border-radius: 10px;
    background: rgba(240,180,41,.06); border: 1px solid rgba(240,180,41,.2);
    font-size: 12px; color: var(--muted); line-height: 1.55;
  }
  .feats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .feat {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #0e141c; border: 1px solid var(--grid);
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .feat b { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>BTCUSDT · 订单流决策板</h1>
  <span id="dir" class="pill wait">观望</span>
  <span id="gen" class="meta"></span>
  <span class="meta" style="width:100%">
    只亮有边信号 · 默认 15m · 弱边一律「无边/观望」· 不过滤的 ~50% 概率不再展示
  </span>
</header>
<main>
  <div class="price-row">
    <div class="price" id="price">—</div>
    <div class="meta" id="summary">加载中…</div>
  </div>

  <div class="board wait-state" id="board">
    <div class="kicker">当前决策</div>
    <div class="headline" id="headline">加载中…</div>
    <div class="detail" id="detail"></div>
    <div class="risk" id="risk"></div>
  </div>

  <div class="grid" id="signals"></div>

  <div class="card">
    <h2>近 4 小时 mid</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="meta" id="status" style="margin-top:8px"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>过滤门槛 · 样本外（walk-forward）</h2>
    <div class="metrics" id="oos"></div>
    <div class="note" id="note"></div>
    <div style="margin-top:10px" class="meta">当前特征快照</div>
    <div class="feats" id="feats"></div>
  </div>
</main>
<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const DATA_URL = './data/latest_forecast.json';

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const wrap = canvas.parentElement.getBoundingClientRect();
  canvas.width = Math.floor(wrap.width * dpr);
  canvas.height = Math.floor(wrap.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); if (window.__last) draw(window.__last); });

function pct(p) {
  if (p == null || isNaN(Number(p))) return '—';
  return (Number(p) * 100).toFixed(1) + '%';
}
function actionLabel(a) {
  if (a === 'long') return '多';
  if (a === 'short') return '空';
  return '观望';
}
function pillClass(action) {
  if (action === 'long') return 'long';
  if (action === 'short') return 'short';
  return 'wait';
}

function draw(data) {
  window.__last = data;
  resize();
  const W = canvas.parentElement.getBoundingClientRect().width;
  const H = canvas.parentElement.getBoundingClientRect().height;
  const pad = { l: 58, r: 12, t: 12, b: 24 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;
  const mid = (data.history && data.history.mid) ? data.history.mid.slice(-240) : [];
  if (!mid.length) return;
  let ymin = Math.min(...mid), ymax = Math.max(...mid);
  const span = ymax - ymin || 1;
  ymin -= span * 0.08; ymax += span * 0.08;
  const xAt = i => pad.l + (mid.length <= 1 ? 0 : (i / (mid.length - 1)) * plotW);
  const yAt = v => pad.t + (1 - (v - ymin) / (ymax - ymin)) * plotH;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#1e2a3a';
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + (g / 4) * plotH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    const val = ymax - (g / 4) * (ymax - ymin);
    ctx.fillStyle = '#8b9bb4';
    ctx.font = '11px ui-sans-serif, system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(0), pad.l - 6, y + 4);
  }
  ctx.beginPath();
  mid.forEach((v, i) => {
    const x = xAt(i), y = yAt(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#5b8def';
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

function renderBoard(data) {
  const d = data.decision || {};
  const action = d.action || 'wait';
  const board = document.getElementById('board');
  board.className = 'board ' + (action === 'long' ? 'long-state' : action === 'short' ? 'short-state' : 'wait-state');
  document.getElementById('headline').textContent = d.headline || '无边 / 观望';
  document.getElementById('detail').textContent = d.detail || d.risk_note || '';
  let risk = d.risk_note || '';
  if (d.rolling_bucket_hit && d.rolling_bucket_hit.hit != null) {
    risk += ` 近端同桶命中≈${(d.rolling_bucket_hit.hit*100).toFixed(0)}%（n=${d.rolling_bucket_hit.n}）。`;
  }
  if (d.flow_confirm && d.flow_confirm.available) {
    risk += d.flow_confirm.aligned ? ' 订单流多数对齐。' : ' 订单流未对齐。';
  }
  document.getElementById('risk').textContent = risk;
  const pill = document.getElementById('dir');
  pill.textContent = actionLabel(action);
  pill.className = 'pill ' + pillClass(action);
}

function renderSignals(data) {
  const box = document.getElementById('signals');
  const sigs = data.signals || [];
  const cals = data.calibrations || {};
  box.innerHTML = sigs.map(s => {
    const actionable = !!s.actionable;
    const enabled = s.horizon_enabled !== false;
    const action = s.action || 'wait';
    let badgeCls = 'wait', badgeTxt = '观望';
    if (!enabled) { badgeCls = 'off'; badgeTxt = '停用'; }
    else if (actionable && action === 'long') { badgeCls = 'go'; badgeTxt = '多'; }
    else if (actionable && action === 'short') { badgeCls = 'short'; badgeTxt = '空'; }

    let body;
    if (!enabled) {
      body = `<div class="big wait">停用</div>
        <div class="sub">该周期样本外过滤后仍无稳定边，默认不参与决策。</div>
        <div class="sub">整体方向准确率 <b>${pct((data.oos_metrics?.[s.label]?.direction||{}).accuracy)}</b></div>`;
    } else if (!actionable) {
      body = `<div class="big wait">无边 / 观望</div>
        <div class="sub">${s.reason || '未过置信门槛'}</div>
        <div class="sub">门槛 |P−0.5| ≥ <b>${s.edge_threshold ?? '—'}</b>
          · 该桶 OOS 命中 <b>${pct(s.bucket_oos_hit)}</b>
          · 开火率 <b>${pct(s.bucket_oos_coverage)}</b></div>
        <div class="sub">原始 P(上涨) <b>${pct(s.p_up_raw)}</b>（未达门槛，界面不展示为交易概率）</div>`;
    } else {
      const side = action === 'long' ? 'long' : 'short';
      body = `<div class="big ${side}">${actionLabel(action)}${s.strength ? ' · ' + s.strength : ''}</div>
        <div class="sub">P(上涨) <b>${pct(s.p_up)}</b> · 边相对 50% <b>${pct(s.edge_vs_50)}</b></div>
        <div class="sub">门槛 |P−0.5| ≥ <b>${s.edge_threshold}</b>
          · 该桶 OOS 命中 <b>${pct(s.bucket_oos_hit)}</b>（n=${s.bucket_oos_n ?? '—'}）
          · 开火率 <b>${pct(s.bucket_oos_coverage)}</b></div>
        ${s.rolling_bucket_hit && s.rolling_bucket_hit.hit != null
          ? `<div class="sub">近端同桶命中 <b>${pct(s.rolling_bucket_hit.hit)}</b>（n=${s.rolling_bucket_hit.n}）</div>` : ''}
        ${s.breakout_note
          ? `<div class="sub" style="margin-top:8px;color:var(--accent)">${s.breakout_note.label}
               · p=${pct(s.breakout_note.p)}
               ${s.breakout_note.oos_precision != null ? '· OOS精确度 ' + pct(s.breakout_note.oos_precision) : ''}</div>` : ''}
        <div class="sub" style="margin-top:8px">${s.risk_note || ''}</div>`;
    }
    const hot = actionable ? (action === 'long' ? 'hot-long' : 'hot-short') : 'dim';
    return `<div class="card ${hot}">
      <span class="badge ${badgeCls}">${badgeTxt}</span>
      <h2>${s.label} · ${s.horizon_min}分钟</h2>
      ${body}
    </div>`;
  }).join('');
}

function renderOos(data) {
  const box = document.getElementById('oos');
  const cals = data.calibrations || {};
  const oos = data.oos_metrics || {};
  const rows = [];
  ['15m','1h','4h'].forEach(k => {
    const c = cals[k] || (oos[k] && oos[k].calibration) || {};
    const d = oos[k] && oos[k].direction;
    rows.push(`<div class="metric"><div class="k">${k} 过滤门槛 |P−0.5|</div><div class="v">${c.threshold != null ? c.threshold : '—'}</div></div>`);
    rows.push(`<div class="metric"><div class="k">${k} 过滤后 OOS 命中</div><div class="v">${c.hit != null ? (c.hit*100).toFixed(1)+'%' : '—'} <span style="font-size:11px;color:var(--muted)">${c.achievable ? '✓≥55%' : '未达'}</span></div></div>`);
    rows.push(`<div class="metric"><div class="k">${k} 开火率 / 全量准确率</div><div class="v">${c.coverage != null ? (c.coverage*100).toFixed(1)+'%' : '—'} / ${d && d.accuracy != null ? (d.accuracy*100).toFixed(1)+'%' : '—'}</div></div>`);
  });
  box.innerHTML = rows.join('');
  const dq = data.data_quality || {};
  document.getElementById('note').textContent =
    (dq.note || '') +
    ' 非投资建议；展示命中率为 walk-forward 样本外过滤桶统计，不保证未来收益。';
  const snap = data.feature_snapshot || {};
  const show = ['cvd_slope_15','d_imb_5','taker_imb_15','ret_15','vol_z_15','range_pos_5','rvol_15'];
  document.getElementById('feats').innerHTML = show.map(k => {
    const v = snap[k];
    return `<span class="feat">${k} <b>${v == null ? '—' : Number(v).toFixed(4)}</b></span>`;
  }).join('');
}

async function refresh() {
  const st = document.getElementById('status');
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const okMode = data.mode === 'decision_board_v2' || data.mode === 'short_horizon_signals' || (data.signals && data.signals.length);
    if (!okMode) {
      st.textContent = '等待决策板 JSON…';
      return;
    }
    const s = data.summary || {};
    document.getElementById('price').textContent = Number(s.last_mid).toFixed(2);
    const nAct = s.n_actionable != null ? s.n_actionable : (data.n_actionable || 0);
    document.getElementById('summary').textContent =
      (s.headline || s.status || '—') +
      ` · 可交易卡片 ${nAct}` +
      (data.venues ? ' · ' + (Array.isArray(data.venues) ? data.venues.join('+') : data.venues) : '');
    document.getElementById('gen').textContent = data.generated_at_shanghai || '';
    renderBoard(data);
    draw(data);
    renderSignals(data);
    renderOos(data);
    let ageTxt = '';
    try {
      const g = data.generated_at_utc || data.generated_at_shanghai;
      const t = Date.parse(g && String(g).includes('CST') ? String(g).replace(' CST','+08:00').replace(' ','T') : g);
      if (!isNaN(t)) ageTxt = ' · 距上次生成 ' + Math.max(0, Math.round((Date.now()-t)/1000)) + 's';
    } catch (_) {}
    st.textContent = '已刷新 ' + new Date().toLocaleTimeString() + ageTxt;
  } catch (e) {
    st.textContent = '等待信号文件… ' + e.message;
  }
}
resize();
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
