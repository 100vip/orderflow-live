<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTCUSDT · Timestral-209M 订单流预测</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e6edf3;
    --muted: #8b9bb4;
    --hist: #5b8def;
    --med: #f0b429;
    --band: rgba(240, 180, 41, 0.18);
    --up: #3ecf8e;
    --down: #f07178;
    --grid: #1e2a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    padding: 16px 20px 8px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline;
    border-bottom: 1px solid var(--grid);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .pill.up { background: rgba(62,207,142,.15); color: var(--up); }
  .pill.down { background: rgba(240,113,120,.15); color: var(--down); }
  .pill.flat { background: rgba(139,155,180,.15); color: var(--muted); }
  main { padding: 12px 16px 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--grid); border-radius: 12px;
    padding: 12px 12px 8px; max-width: 1100px; margin: 0 auto;
  }
  canvas { width: 100%; height: 420px; display: block; }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted);
    padding: 8px 4px 4px;
  }
  .swatch { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .err { color: var(--down); padding: 20px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>BTCUSDT 1m · Timestral-209M</h1>
  <span id="summary" class="meta">加载中…</span>
  <span id="dir" class="pill flat">—</span>
  <span id="gen" class="meta"></span>
  <span class="meta" style="width:100%;margin-top:2px">现价 mid 来自最近 1m 特征 · 预测约每 1 分钟更新（非 tick 级实时）</span>
</header>
<main>
  <div class="card">
    <canvas id="chart" width="1000" height="420"></canvas>
    <div class="legend">
      <span><i class="swatch" style="background:var(--hist)"></i>历史 mid</span>
      <span><i class="swatch" style="background:var(--med)"></i>预测中位</span>
      <span><i class="swatch" style="background:var(--band);height:10px;width:14px"></i>q10–q90</span>
      <span id="status"></span>
    </div>
  </div>
</main>
<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resize(); if (window.__last) draw(window.__last); });

function draw(data) {
  window.__last = data;
  resize();
  const W = canvas.getBoundingClientRect().width;
  const H = canvas.getBoundingClientRect().height;
  const pad = { l: 64, r: 16, t: 16, b: 36 };
  const plotW = W - pad.l - pad.r;
  const plotH = H - pad.t - pad.b;

  const histN = Math.min(180, data.history.mid.length);
  const histMid = data.history.mid.slice(-histN);
  const med = data.forecast.mid_median;
  const q10 = data.forecast.mid_q10;
  const q90 = data.forecast.mid_q90;
  const all = histMid.concat(q10, q90, med);
  let ymin = Math.min(...all), ymax = Math.max(...all);
  const span = ymax - ymin || 1;
  ymin -= span * 0.08; ymax += span * 0.08;

  const total = histMid.length + med.length;
  const xAt = i => pad.l + (i / Math.max(total - 1, 1)) * plotW;
  const yAt = v => pad.t + (1 - (v - ymin) / (ymax - ymin)) * plotH;

  ctx.clearRect(0, 0, W, H);
  // grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#1e2a3a';
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + (g / 4) * plotH;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    const val = ymax - (g / 4) * (ymax - ymin);
    ctx.fillStyle = '#8b9bb4';
    ctx.font = '11px ui-sans-serif, system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(1), pad.l - 8, y + 4);
  }

  // now line
  const nowX = xAt(histMid.length - 1);
  ctx.strokeStyle = '#3a4a5e';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(nowX, pad.t); ctx.lineTo(nowX, pad.t + plotH); ctx.stroke();
  ctx.setLineDash([]);

  // band
  ctx.beginPath();
  for (let i = 0; i < med.length; i++) {
    const x = xAt(histMid.length - 1 + i);
    const y = yAt(q90[i]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = med.length - 1; i >= 0; i--) {
    const x = xAt(histMid.length - 1 + i);
    ctx.lineTo(x, yAt(q10[i]));
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(240, 180, 41, 0.18)';
  ctx.fill();

  // history
  ctx.beginPath();
  histMid.forEach((v, i) => {
    const x = xAt(i), y = yAt(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#5b8def';
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // median forecast (connect from last hist)
  ctx.beginPath();
  ctx.moveTo(xAt(histMid.length - 1), yAt(histMid[histMid.length - 1]));
  med.forEach((v, i) => ctx.lineTo(xAt(histMid.length + i), yAt(v)));
  ctx.strokeStyle = '#f0b429';
  ctx.lineWidth = 2;
  ctx.stroke();

  // footer labels
  ctx.fillStyle = '#8b9bb4';
  ctx.font = '11px ui-sans-serif, system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('历史', pad.l, H - 12);
  ctx.textAlign = 'right';
  ctx.fillText('预测 +' + med.length + 'm', W - pad.r, H - 12);
}

async function refresh() {
  const st = document.getElementById('status');
  try {
    const r = await fetch('./data/latest_forecast.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const s = data.summary || {};
    const dir = s.direction || 'flat';
    document.getElementById('summary').textContent =
      `last ${Number(s.last_mid).toFixed(2)} → H${data.horizon} ${Number(s.pred_mid_end).toFixed(2)} ` +
      `(${s.delta_end >= 0 ? '+' : ''}${Number(s.delta_end).toFixed(2)} / ${Number(s.pct_end).toFixed(3)}%)`;
    const pill = document.getElementById('dir');
    pill.textContent = dir.toUpperCase();
    pill.className = 'pill ' + dir;
    const genLabel = data.generated_at_shanghai || data.generated_at_utc || '';
    document.getElementById('gen').textContent =
      genLabel + ' · ctx ' + data.context_len + ' · ' + (data.source || '');
    draw(data);
    let ageTxt = '';
    try {
      const g = data.generated_at_utc || data.generated_at_shanghai;
      const t = Date.parse(g && g.includes('CST') ? g.replace(' CST','+08:00').replace(' ','T') : g);
      if (!isNaN(t)) ageTxt = ' · 距上次生成 ' + Math.max(0, Math.round((Date.now()-t)/1000)) + 's';
    } catch (_) {}
    st.textContent = '已刷新 ' + new Date().toLocaleTimeString() + ageTxt;
  } catch (e) {
    st.textContent = '等待预测文件… ' + e.message;
  }
}

resize();
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
